; PHP-Einstellungen für klassisches Hosting (DomainFactory liest .user.ini
; im Doc-Root). Entspricht docker/php.ini, das nur im Container greift.

; Familienfotos: einzeln bis 12 MB, in Summe genug für eine Handvoll auf einmal.
upload_max_filesize = 12M
post_max_size = 60M
max_file_uploads = 20

; Reicht für das Verkleinern großer Bilder mit GD.
memory_limit = 256M
