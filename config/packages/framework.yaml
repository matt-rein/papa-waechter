# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Hängt an jede Asset-URL ?v=<Version>. Beim Deploy wird der Git-SHA
    # eingetragen, damit Browser nach einer CSS-Änderung nicht am alten Stand
    # hängen bleiben – Papas Seite liegt als Homescreen-App im Cache.
    assets:
        version: '%env(APP_ASSET_VERSION)%'
        version_format: '%%s?v=%%s'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
