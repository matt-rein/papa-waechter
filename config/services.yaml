# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.display_timezone: '%env(APP_TIMEZONE)%'
    app.alert_threshold_hours: '%env(int:ALERT_THRESHOLD_HOURS)%'
    app.alert_reminder_hours: '%env(int:ALERT_REMINDER_HOURS)%'
    # Gültigkeitsdauer einer Bestätigung auf Papas Seite (siehe CheckInWindow).
    app.checkin_window_hours: '%env(int:CHECKIN_WINDOW_HOURS)%'
    app.mailer_from: '%env(MAILER_FROM)%'
    # Familienfotos für Papas Hintergrundbild.
    #
    # Bewusst NICHT unter var/: dort wird bei Problemen gern mal aufgeräumt
    # (Cache leeren, Ordner löschen) – die Originale wären dann weg. Sie liegen
    # deshalb in einem eigenen Ordner neben dem Projekt, wo man sie per Finder
    # befüllen und mitsichern kann. Aus dem Repo sind sie ausgeschlossen.
    app.photo_dir: '%kernel.project_dir%/photos'

    # Verkleinerte Fassungen und Vorschaubilder. Reine Wegwerf-Daten: darf
    # jederzeit gelöscht werden, entsteht beim nächsten Aufruf neu.
    app.photo_cache_dir: '%kernel.project_dir%/var/photo-cache'

    # Pfad, der auf der Fotoseite zum Kopieren angezeigt wird. Im Container ist
    # der echte Pfad "/app/photos" – damit kommt im Finder niemand weiter.
    # Deshalb blendet compose den Pfad des Rechners ein.
    app.photo_dir_label: '%env(default:app.photo_dir:APP_PHOTO_DIR_LABEL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $displayTimezone: '%app.display_timezone%'
            int $alertThresholdHours: '%app.alert_threshold_hours%'
            int $alertReminderHours: '%app.alert_reminder_hours%'
            int $checkinWindowHours: '%app.checkin_window_hours%'
            string $mailerFrom: '%app.mailer_from%'
            string $photoDir: '%app.photo_dir%'
            string $photoCacheDir: '%app.photo_cache_dir%'
            string $photoDirLabel: '%app.photo_dir_label%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
