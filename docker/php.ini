; Projekt-spezifische PHP-Einstellungen.

; Intern rechnen und speichern wir in UTC (Anzeige erst im Template lokal).
date.timezone = UTC

; OPcache für Produktion.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Sinnvolle Limits für eine kleine App.
memory_limit = 256M

; Familienfotos: einzeln bis 12 MB, in Summe genug für eine Handvoll auf einmal.
upload_max_filesize = 12M
post_max_size = 60M
max_file_uploads = 20
