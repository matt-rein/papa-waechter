name: Deploy to Production

on:
  # Benötigte Secrets: DEPLOY_SSH_KEY, DEPLOY_SSH_HOST, DEPLOY_SSH_USER,
  # DEPLOY_PATH. Optional: DEPLOY_SSH_PORT (Default 22),
  # DEPLOY_PHP_BIN (Default php84 – das nackte php ist am df.eu 7.4),
  # DEPLOY_HEALTHCHECK_URL.
  #
  # Auf dem Server muss einmalig .env.local angelegt sein (Vorlage:
  # .env.local.dist) – mit APP_ENV=prod und den Zugangsdaten. Der Workflow
  # prüft das und bricht sonst ab.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          # Muss zur PHP-Version des Servers passen; composer.json pinnt sie
          # zusätzlich über config.platform.
          php-version: '8.4'
          # gd/exif werden für die Familienfotos gebraucht, pdo_sqlite für die DB.
          extensions: intl, pdo, pdo_sqlite, gd, exif, mbstring, xml, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress
        env:
          APP_ENV: prod

      # Kein Asset-Build: das CSS liegt fertig in public/, JavaScript steht
      # inline in den Templates. Für frische Assets im Browser sorgt
      # APP_ASSET_VERSION (siehe unten).

      - name: Lint
        run: |
          php bin/console lint:twig templates --env=prod
          php bin/console lint:container --env=prod
        env:
          APP_ENV: prod
          APP_SECRET: ci-only-not-a-real-secret
          APP_ASSET_VERSION: ci

      - name: Check required secrets
        # Ohne diese Prüfung scheitert der Deploy weiter unten mit einer
        # kryptischen SSH-Meldung.
        run: |
          missing=""
          [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]  || missing="$missing DEPLOY_SSH_KEY"
          [ -n "${{ secrets.DEPLOY_SSH_HOST }}" ] || missing="$missing DEPLOY_SSH_HOST"
          [ -n "${{ secrets.DEPLOY_SSH_USER }}" ] || missing="$missing DEPLOY_SSH_USER"
          [ -n "${{ secrets.DEPLOY_PATH }}" ]     || missing="$missing DEPLOY_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Fehlende GitHub-Secrets:$missing – siehe README, Abschnitt „GitHub-Secrets“."
            exit 1
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_SSH_PORT || 22 }}" -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Check server configuration
        # Lieber hier abbrechen als die Seite im Dev-Modus laufen lassen.
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_SSH_PORT || 22 }}" \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" << 'ENDSSH'
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            if [ ! -f .env.local ]; then
              echo "::error::.env.local fehlt auf dem Server. Vorlage: .env.local.dist"
              exit 1
            fi
            if ! grep -qE '^APP_ENV=prod' .env.local; then
              echo "::error::In .env.local fehlt APP_ENV=prod – die App liefe im Dev-Modus."
              exit 1
            fi

            # An diesen Ordnern hängen Daten, die kein Deploy anfassen darf.
            mkdir -p data photos var/cache var/log var/photo-cache
          ENDSSH

      - name: Deploy via rsync
        # WICHTIG: alle projektbezogenen Muster mit führendem "/" verankern.
        # Ohne den Slash greift ein Muster auf JEDER Ebene – "data/" hätte sonst
        # auch vendor/symfony/string/Resources/data/ ausgelassen und die
        # Anwendung auf dem Server unbrauchbar gemacht.
        #
        # Ausgenommen bleiben die Ordner mit echten Daten: data/ enthält die
        # SQLite-Datei mit allen Check-ins, photos/ die Familienbilder. Beide
        # sind gitignoriert und lägen ohne --exclude nach dem ersten --delete
        # im Nichts.
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SSH_PORT || 22 }}" \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.gitignore' \
            --exclude='/.gitattributes' \
            --exclude='/.editorconfig' \
            --exclude='/.idea/' \
            --exclude='/.claude/' \
            --exclude='.DS_Store' \
            --exclude='/.env.local' \
            --exclude='/.env.*.local' \
            --exclude='/.env.dev' \
            --exclude='/.env.test' \
            --exclude='/data/' \
            --exclude='/photos/' \
            --exclude='/var/' \
            --exclude='/tests/' \
            --exclude='/docker/' \
            --exclude='/frankenphp/' \
            --exclude='/Dockerfile' \
            --exclude='/.dockerignore' \
            --exclude='/compose*.yaml' \
            --exclude='/*.md' \
            ./ \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Run post-deploy commands on server
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_SSH_PORT || 22 }}" \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" << 'ENDSSH'
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            PHP="${{ secrets.DEPLOY_PHP_BIN || 'php84' }}"
            "$PHP" -v | head -1

            # Sicherung vor jeder Schemaänderung, die letzten 10 behalten.
            # data/ ist im rsync ausgenommen, die Backups überleben --delete.
            if [ -f data/data_prod.db ]; then
              cp -p data/data_prod.db "data/data_prod.db.backup-$(date +%Y%m%d-%H%M%S)"
              ls -1t data/data_prod.db.backup-* 2>/dev/null | tail -n +11 | xargs -r rm --
            fi

            # Frische Asset-URLs (?v=...) – sonst hängt Papas iPad am alten CSS.
            SHA="${{ github.sha }}"
            if grep -q '^APP_ASSET_VERSION=' .env.local; then
              sed -i "s/^APP_ASSET_VERSION=.*/APP_ASSET_VERSION=${SHA}/" .env.local
            else
              printf '\nAPP_ASSET_VERSION=%s\n' "$SHA" >> .env.local
            fi

            "$PHP" bin/console cache:clear --env=prod --no-debug
            "$PHP" bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
            "$PHP" bin/console cache:warmup --env=prod --no-debug
          ENDSSH

      - name: Verify deployment
        run: |
          url="${{ secrets.DEPLOY_HEALTHCHECK_URL }}"
          if [ -z "$url" ]; then
            echo "DEPLOY_HEALTHCHECK_URL nicht gesetzt – Prüfung übersprungen."
            exit 0
          fi

          # GitHub führt Schritte mit "bash -e" aus: ohne set +e bräche der
          # Schritt schon hier ab und die Auswertung darunter liefe nie.
          # Genau curls Exit-Code sagt uns aber, WAS schiefging.
          set +e
          status=$(curl -sSLo /dev/null -w "%{http_code}" --max-time 15 "$url" 2>/tmp/curl.err)
          curl_exit=$?
          set -e

          echo "URL:         $url"
          echo "HTTP-Status: $status (curl-Exit $curl_exit)"
          [ -s /tmp/curl.err ] && echo "curl: $(cat /tmp/curl.err)"

          if [ "$status" = "200" ]; then
            echo "Deployment erreichbar."
            exit 0
          fi

          case "$curl_exit" in
            35|51|60) echo "::error::TLS-Problem. Ist SSL für die Domain aktiv und das Zertifikat gültig? (curl-Exit $curl_exit)" ;;
            6)        echo "::error::Hostname nicht auflösbar." ;;
            7)        echo "::error::Verbindung abgelehnt." ;;
            28)       echo "::error::Zeitüberschreitung nach 15 Sekunden." ;;
            0)        echo "::error::Server antwortet, aber mit HTTP $status statt 200." ;;
            *)        echo "::error::Healthcheck fehlgeschlagen (HTTP $status, curl-Exit $curl_exit)." ;;
          esac
          exit 1
